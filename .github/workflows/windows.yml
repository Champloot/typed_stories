# Builds game.exe for Windows on every push (cross-compiled with mingw-w64) and
# keeps it as an artifact: Actions -> the run -> typed_stories-windows.
# A tag like v0.1 also attaches the zip to a GitHub release.
name: windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: mingw-w64
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-mingw-w64-x86-64 zip unzip
      - name: raylib for Windows
        run: make raylib-win
      - name: game.exe
        run: make dist-windows
      - uses: actions/upload-artifact@v4
        with:
          name: typed_stories-windows
          path: dist/typed_stories
      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: typed_stories-windows.zip
