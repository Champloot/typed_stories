# Настройки typed_stories. Меняй числа и перезапускай игру.
# Строку можно удалить: тогда берётся значение по умолчанию (оно и записано здесь).
# Если ошибёшься в имени или числе, игра при запуске скажет, в какой строке.

[time]
answer_scale = 1.0        # x время на ответ в каждой сцене (2.0 = вдвое больше времени)
walk_scale = 1.0          # x время на ходьбу в магазине
minigame_scale = 1.0      # x время на мини-игры

[day]
scenes_per_phase = 0      # сцен в каждой части дня (утро, дорога...); 0 = как в паке
minigames = 1             # 0 = без мини-игр: ответ сразу срабатывает
store_walk = 1            # 0 = без ходьбы по магазину
meter_start = 0           # с чего начинаются все шкалы (1..10); 0 = как в паке

[style]
plain = 10                # очки стиля за простую фразу ("yes")
nicer = 30                # ... за фразу получше ("of course")
fancy = 60                # ... за изысканную ("I would be delighted")
typo_factor = 0.5         # x очки, если в ответе опечатка
wear_left = 0.5           # сколько "износа" фразы остаётся на следующий день (0 = забывается сразу, 1 = никогда)
word_bonus = 100          # очки за слово дня
wordsmith_days = 5        # дней со словом дня до секретной сцены

[mash]                    # барабанить по клавишам (двери лифта, одеяло, поводок)
presses = 1.0             # x сколько нажатий нужно
leak = 1.0                # сколько нажатий "утекает" в секунду

[timing]                  # поймать стрелку в зелёной зоне (плита, кофемашина)
sweep = 1.0               # секунд на один проход стрелки (больше = медленнее)
zone = 0.2                # ширина зелёной зоны, доля дорожки (0.2 = пятая часть)

[cross]                   # перейти дорогу
speed = 1.0               # x скорость машин и велосипедов
gap = 4                   # минимум свободных клеток между ними

[catch]                   # поймать яблоки
apples = 7                # сколько яблок падает (до 12)
fall = 0.2                # секунд на одну клетку падения (больше = медленнее)
every = 0.75              # секунд между яблоками

[grid]
step = 0.12               # секунд на клетку, когда держишь WASD (магазин, дорога, корзина)

[store]
cart_step = 0.30          # секунд на клетку у тележки (больше = медленнее)
carts = 3                 # сколько тележек катается (0..3)

[levels]
unlock_all = 0            # 1 = все уровни открыты сразу (иначе каждый открывается после прохождения предыдущего)

[window]
width = 1280
height = 800
fullscreen = 0            # 1 = на весь экран (F11 или Alt+Enter переключают в игре)
fade = 0.18               # секунд на появление нового экрана
